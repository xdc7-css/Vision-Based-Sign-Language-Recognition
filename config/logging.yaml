version: 1
disable_existing_loggers: false

formatters:
  standard:
    format: "%(asctime)s [%(levelname)s] %(name)s: %(message)s"
    datefmt: "%H:%M:%S"
  detailed:
    format: "%(asctime)s [%(levelname)s] %(name)s (%(filename)s:%(lineno)d): %(message)s"
    datefmt: "%Y-%m-%d %H:%M:%S"

handlers:
  console:
    class: logging.StreamHandler
    formatter: standard
    level: INFO
    stream: ext://sys.stdout

  file:
    class: logging.handlers.RotatingFileHandler
    formatter: detailed
    level: DEBUG
    filename: data/logs/arsl.log
    maxBytes: 10485760
    backupCount: 3
    encoding: utf-8

  errors:
    class: logging.handlers.RotatingFileHandler
    formatter: detailed
    level: WARNING
    filename: data/logs/arsl_errors.log
    maxBytes: 5242880
    backupCount: 2
    encoding: utf-8

loggers:
  src:
    level: INFO
    handlers: [console, file, errors]
    propagate: false

  src.infrastructure.recognition:
    level: DEBUG
    handlers: [console, file]
    propagate: false

  src.infrastructure.hand_detection:
    level: DEBUG
    handlers: [console, file]
    propagate: false

root:
  level: INFO
  handlers: [console, file]
